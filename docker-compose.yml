services:
  mongodb:
    image: mongo:7.0
    container_name: folderly-mongodb
    command: ["mongod", "--bind_ip_all"]
    restart: unless-stopped
    volumes:
      - folderly-mongodb-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - shared_network

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: folderly-server
    depends_on:
      mongodb:
        condition: service_healthy
    env_file:
      - ./.env
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-4000}
      TRUST_PROXY: ${TRUST_PROXY:-1}
      FRONTEND_URL: ${FRONTEND_URL:-https://folderly.duckdns.org}
      DATABASE_URL: ${DATABASE_URL:-mongodb://folderly-mongodb:27017/folderly}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
    ports:
      - "127.0.0.1:4000:4000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/healthz').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    networks:
      - shared_network

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/}
    container_name: folderly-client
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "127.0.0.1:3001:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - shared_network

volumes:
  folderly-mongodb-data:

networks:
  shared_network:
    external: true
